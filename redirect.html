<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Inspiration in Minds</title>

    <style>
*,
*::before,
*::after {
    box-sizing: border-box;
}

:root {
    --bg: #0d1117;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --yellow: #d29922;
    --bulb-glass: #21262d;
    --bulb-metal: #484f58;
    --bulb-pulse: #3a3320;
}

@media (prefers-color-scheme: light) {
    :root {
        --bg: #ffffff;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #0969da;
        --yellow: #9a6700;
        --bulb-glass: #eaeef2;
        --bulb-metal: #8c959f;
        --bulb-pulse: #f5e6b8;
    }
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    line-height: 1.5;
    text-align: center;
}

.panel {
    width: 100%;
    max-width: 560px;
    padding: 40px 28px;
}

/* The inspiration's logo (or the fallback bulb) */

.logo {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
}

.logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.logo svg {
    height: 100%;
}

.bulb-glass {
    fill: var(--bulb-glass);
    stroke: var(--bulb-metal);
    stroke-width: 3;
}

.bulb-base {
    fill: var(--bulb-metal);
}

h1 {
    margin: 0 0 6px;
    font-size: 2rem;
}

.subtitle {
    margin: 0 0 36px;
    color: var(--muted);
}

.subtitle .repo {
    color: var(--text);
    font-weight: 600;
    word-break: break-all;
}

.open-button {
    display: block;
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #d29922, #e3b341);
    color: #1c1400;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .18s ease;
}

.open-button:hover {
    background: linear-gradient(135deg, #e3b341, #f2cc60);
    transform: translateY(-2px);
}

.open-button:active {
    transform: translateY(0);
}

.status {
    min-height: 24px;
    margin: 18px 0 0;
    color: var(--muted);
    font-size: .95rem;
}

body.failed .status {
    color: var(--yellow);
}

.download-line {
    margin: 26px 0 0;
    color: var(--muted);
    font-size: .98rem;
}

.download-line a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
}

.download-line a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>

    <main class="panel">

        <div class="logo" id="logo">
            <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lightbulb">
                <path class="bulb-glass"
                      d="M50 5
                         C 27 5 12 22 12 43
                         C 12 57 20 66 27 74
                         C 32 80 35 84 35 90
                         L 65 90
                         C 65 84 68 80 73 74
                         C 80 66 88 57 88 43
                         C 88 22 73 5 50 5 Z" />
                <rect class="bulb-base" x="35" y="94" width="30" height="7" rx="3" />
                <rect class="bulb-base" x="37" y="104" width="26" height="7" rx="3" />
                <rect class="bulb-base" x="41" y="114" width="18" height="6" rx="3" />
            </svg>
        </div>

        <h1>Open Inspiration</h1>

        <p class="subtitle" id="subtitle"></p>

        <button class="open-button" id="openButton">
            Open in Minds app
        </button>

        <p class="status" id="status"></p>

        <p class="download-line">
            Don't have the Minds app installed?
            <a href="https://imbue.com/product/minds" target="_blank" rel="noopener">
                Download Now
            </a>
        </p>

    </main>

    <script>
// Deeplink format from imbue-ai/mngr#2565:
//   minds://create?git_url=<repo>&branch=<ref>
// A bare minds:// just focuses the app, so with no git_url we still try.
//
// Query params:
//   git_url  - clone URL of the inspiration repository
//   branch   - optional ref to check out
//   name     - optional display name for the inspiration
//   logo     - optional https URL of the inspiration's logo image

const params = new URLSearchParams(location.search);
const gitUrl = params.get('git_url');
const branch = params.get('branch');
const name = params.get('name');

function buildMindsUrl() {
    if (!gitUrl) return 'minds://';
    let url = `minds://create?git_url=${encodeURIComponent(gitUrl)}`;
    if (branch) url += `&branch=${encodeURIComponent(branch)}`;
    return url;
}

// Swap the fallback bulb for the inspiration's own logo, if given
// (https-only so the page can't be made to load arbitrary schemes).
const logoUrl = params.get('logo');
if (logoUrl && /^https:\/\//i.test(logoUrl)) {
    const img = document.createElement('img');
    img.alt = 'Inspiration logo';
    img.addEventListener('load', () => {
        const logo = document.getElementById('logo');
        logo.innerHTML = '';
        logo.appendChild(img);
    });
    img.src = logoUrl;
}

const subtitle = document.getElementById('subtitle');
if (gitUrl) {
    subtitle.append('Create a workspace from ');
    const span = document.createElement('span');
    span.className = 'repo';
    span.textContent = name || gitUrl;
    subtitle.appendChild(span);
    if (branch) subtitle.append(` (${branch})`);
} else {
    subtitle.textContent = 'Open the Minds app.';
}

let failTimer = null;
const statusEl = document.getElementById('status');

function attempt() {
    document.body.classList.remove('failed');
    document.body.classList.add('waiting');
    statusEl.textContent = 'Opening Minds…';

    window.location.href = buildMindsUrl();

    // If the protocol handler works the page loses focus/visibility.
    // Still visible and focused a moment later means Minds is missing.
    clearTimeout(failTimer);
    failTimer = setTimeout(() => {
        document.body.classList.remove('waiting');
        if (!document.hidden && document.hasFocus()) {
            document.body.classList.add('failed');
            statusEl.textContent = "We couldn't detect the Minds app on this computer.";
        } else {
            statusEl.textContent = '';
        }
    }, 2000);
}

// The button doubles as "open it now that I've installed Minds".
document.getElementById('openButton').addEventListener('click', attempt);
attempt();
    </script>

</body>
</html>
